name: Pedido ou sugestão
description: Dúvida, problema ou sugestão sobre um sistema da Lex Tecnologias.
title: "[Pedido] "
labels: ["acesso"]
body:
  - type: markdown
    attributes:
      value: |
        Não escreva aqui CPF, telefone, senhas ou dados de clientes: este pedido é público.
        Depois que você enviar, a Lex Tecnologias responde por aqui com as orientações.
  - type: dropdown
    id: sistema
    attributes:
      label: Sistema
      options:
        - Lex Calendário
        - Lex Detetive
        - Lex Audio
        - TalkEncript
        - Lex Messenger
        - Não Esquece Adv
        - Lex Vade Mecum
        - Inteligência Claude
        - PJe-Calc Cidadão para Mac
        - OKENA
        - ARANDU
    validations:
      required: true
  - type: dropdown
    id: so
    attributes:
      label: Sistema operacional
      options:
        - Windows
        - Mac (Apple Silicon)
        - Mac (Intel)
        - Linux
        - Android
        - iPhone
    validations:
      required: true
  - type: textarea
    id: uso
    attributes:
      label: Como pretende usar
      description: Ex.: advogado autônomo, escritório com 3 pessoas, departamento jurídico.
    validations:
      required: true
